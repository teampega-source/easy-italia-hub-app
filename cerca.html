    var words=q.trim().split(/\s+/).filter(Boolean).map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
    var re=new RegExp('('+words.join('|')+')','gi');
    return esc(text).replace(re,'<mark>$1</mark>');
  }

  /* La lingua predefinita del sito e' l'inglese: chi cerca "permit" non deve
     trovare il vuoto perche' l'indice era scritto solo in italiano. Titoli e
     descrizioni hanno il gemello inglese; le parole chiave stanno tutte
     insieme, cosi' una ricerca in una lingua trova la scheda nell'altra. */
  function lingua(){
    var l = window.EIH_LANG;
    try { l = localStorage.getItem('eih-lang') || l; } catch (e) {}
    return l === 'it' ? 'it' : 'en';
  }
  function tit(p){ return (lingua()!=='it' && p.en) ? p.en.t : p.title; }
  function des(p){ return (lingua()!=='it' && p.en) ? p.en.d : p.desc; }

  function score(page, terms){
    var s=0;
    var title=(page.title+' '+(page.en?page.en.t:'')).toLowerCase();
    var desc=(page.desc+' '+(page.en?page.en.d:'')).toLowerCase();
    var keys=page.keys.toLowerCase();
    var url=page.url.toLowerCase();
    terms.forEach(function(t){
      if(title.indexOf(t)!==-1) s+=10;
      if(url.indexOf(t)!==-1) s+=8;
      if(desc.indexOf(t)!==-1) s+=5;
      if(keys.indexOf(t)!==-1) s+=3;
    });
    return s;
  }

  function search(q){
    if(!q||!q.trim()) return [];
    var terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    var results=PAGES.map(function(p){return{page:p,score:score(p,terms)};}).filter(function(r){return r.score>0;});
    results.sort(function(a,b){return b.score-a.score;});
    return results.map(function(r){return r.page;});
  }

  /* Anche l'esito parla la lingua di chi cerca: prima "Nessun risultato" e
     "3 risultati trovati" uscivano in italiano a chiunque. */
  var ESITO = {
    it:{ nulla:'Nessun risultato per', prova:'Prova con parole diverse o sfoglia le sezioni qui sotto.',
         uno:'1 risultato trovato', molti:' risultati trovati' },
    en:{ nulla:'No results for', prova:'Try different words or browse the sections below.',
         uno:'1 result found', molti:' results found' },
    si:{ nulla:'ප්‍රතිඵල නැත:', prova:'වෙනත් වචන උත්සාහ කරන්න හෝ පහත කොටස් බලන්න.',
         uno:'ප්‍රතිඵල 1ක්', molti:' ප්‍රතිඵල' },
    ta:{ nulla:'முடிவுகள் இல்லை:', prova:'வேறு சொற்களை முயற்சியுங்கள் அல்லது கீழே உள்ள பகுதிகளைப் பாருங்கள்.',
         uno:'1 முடிவு', molti:' முடிவுகள்' }
  };
  function esito(){
    var l = window.EIH_LANG;
    try { l = localStorage.getItem('eih-lang') || l; } catch (e) {}
    return ESITO[l] || ESITO.en;
  }

  function render(pages, q){
    var status=document.getElementById('cerca-status');
    var out=document.getElementById('cerca-results');
    var E=esito();
    if(!pages.length){
      status.textContent='';
      out.innerHTML='<div class="cerca-empty"><strong>'+esc(E.nulla)+' "'+esc(q)+'"</strong><p>'+esc(E.prova)+'</p><div class="cerca-suggestions"><ul><li><a href="/guide">📖 Guide</a></li><li><a href="/percorso">🤖 AI</a></li><li><a href="/diritti-inps">🏛️ INPS</a></li><li><a href="/guida-ssn">🏥 SSN</a></li><li><a href="/patente">🚗 Patente</a></li><li><a href="/housing">🏠 Casa</a></li></ul></div></div>';
      return;
    }
    status.textContent=pages.length===1?E.uno:pages.length+E.molti;
    var html='';
    pages.forEach(function(p){
      html+='<a class="cerca-card" href="'+esc(p.url)+'"><div class="cerca-card-top"><span class="cerca-cat">'+esc(p.cat)+'</span></div><h3>'+p.emoji+' '+highlight(tit(p),q)+'</h3><p>'+highlight(des(p),q)+'</p><div class="cerca-card-url">easyitaliahub.it'+esc(p.url)+'</div></a>';
    });
    out.innerHTML=html;
  }

  function run(){
    var params=new URLSearchParams(location.search);
    var q=params.get('q')||'';
    var input=document.getElementById('cerca-q');
    if(input) input.value=q;
    if(q.trim()){
      var results=search(q);
      render(results,q);
    }
  }

  document.getElementById('cerca-form').addEventListener('submit',function(e){
    e.preventDefault();
    var q=document.getElementById('cerca-q').value.trim();
    if(!q) return;
    history.pushState(null,'','/cerca?q='+encodeURIComponent(q));
    var results=search(q);
    render(results,q);
    document.getElementById('cerca-q').blur();
  });

  window.addEventListener('popstate',run);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',run);
  } else {
    run();
  }
})();
</script>
