  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c});}

  function highlight(text, q){
    if(!q)return esc(text);
    var words=q.trim().split(/\s+/).filter(Boolean).map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
    var re=new RegExp('('+words.join('|')+')','gi');
    return esc(text).replace(re,'<mark>$1</mark>');
  }

  function score(page, terms){
    var s=0;
    var title=page.title.toLowerCase();
    var desc=page.desc.toLowerCase();
    var keys=page.keys.toLowerCase();
    var url=page.url.toLowerCase();
    terms.forEach(function(t){
      if(title.indexOf(t)!==-1) s+=10;
      if(url.indexOf(t)!==-1) s+=8;
      if(desc.indexOf(t)!==-1) s+=5;
      if(keys.indexOf(t)!==-1) s+=3;
    });
    return s;
  }

  function search(q){
    if(!q||!q.trim()) return [];
    var terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    var results=PAGES.map(function(p){return{page:p,score:score(p,terms)};}).filter(function(r){return r.score>0;});
    results.sort(function(a,b){return b.score-a.score;});
    return results.map(function(r){return r.page;});
  }

  function render(pages, q){
    var status=document.getElementById('cerca-status');
    var out=document.getElementById('cerca-results');
    if(!pages.length){
      status.textContent='';
      out.innerHTML='<div class="cerca-empty"><strong>Nessun risultato per "'+esc(q)+'"</strong><p>Prova con parole diverse o sfoglia le sezioni qui sotto.</p><div class="cerca-suggestions"><ul><li><a href="/guide">📖 Guide</a></li><li><a href="/percorso">🤖 AI</a></li><li><a href="/diritti-inps">🏛️ INPS</a></li><li><a href="/guida-ssn">🏥 SSN</a></li><li><a href="/patente">🚗 Patente</a></li><li><a href="/housing">🏠 Casa</a></li></ul></div></div>';
      return;
    }
    status.textContent=pages.length===1?'1 risultato trovato':pages.length+' risultati trovati';
    var html='';
    pages.forEach(function(p){
      html+='<a class="cerca-card" href="'+esc(p.url)+'"><div class="cerca-card-top"><span class="cerca-cat">'+esc(p.cat)+'</span></div><h3>'+p.emoji+' '+highlight(p.title,q)+'</h3><p>'+highlight(p.desc,q)+'</p><div class="cerca-card-url">easyitaliahub.it'+esc(p.url)+'</div></a>';
    });
    out.innerHTML=html;
  }

  function run(){
    var params=new URLSearchParams(location.search);
    var q=params.get('q')||'';
    var input=document.getElementById('cerca-q');
    if(input) input.value=q;
    if(q.trim()){
      var results=search(q);
      render(results,q);
    }
  }

  document.getElementById('cerca-form').addEventListener('submit',function(e){
    e.preventDefault();
    var q=document.getElementById('cerca-q').value.trim();
    if(!q) return;
    history.pushState(null,'','/cerca?q='+encodeURIComponent(q));
    var results=search(q);
    render(results,q);
    document.getElementById('cerca-q').blur();
  });

  window.addEventListener('popstate',run);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',run);
  } else {
    run();
  }
})();
</script>
