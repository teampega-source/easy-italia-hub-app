<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pagina non trovata — Easy Italia Hub</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#7d7058"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<link rel="preconnect" href="https://api.fontshare.com"/>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin/>
<link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&f[]=satoshi@400,500,700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#e9e6e0;--ink:#161412;--muted:#565049;--gold:#7c7059;--coral:#eb5939;--border:rgba(118,118,118,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#f3f1ec,#e9e6e0 60%,#dfdad1);color:var(--ink);
  font-family:'Satoshi',system-ui,sans-serif;padding:2rem;overflow:hidden;position:relative}
.aurora{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none}
.a1{width:480px;height:480px;background:radial-gradient(circle,rgba(124,112,89,.5),transparent 70%);top:-160px;right:-100px}
.a2{width:380px;height:380px;background:radial-gradient(circle,rgba(235,89,57,.25),transparent 70%);bottom:-160px;left:-80px}
main{text-align:center;position:relative;max-width:560px}
.code{font-family:'Clash Grotesk',sans-serif;font-weight:600;font-size:clamp(6rem,22vw,11rem);
  line-height:1;letter-spacing:-.04em;color:var(--ink)}
.code em{font-style:normal;color:var(--gold)}
h1{font-family:'Clash Grotesk',sans-serif;font-weight:500;font-size:1.5rem;margin-top:.75rem}
p{color:var(--muted);margin-top:.75rem;font-size:1.05rem;line-height:1.6}
p .si{font-size:.95rem}
.actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
a.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:9999px;
  text-decoration:none;font-weight:700;font-size:.95rem;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
a.primary{background:var(--ink);color:#f3f1ec}
a.ghost{border:1px solid var(--border);color:var(--ink);background:rgba(40,36,30,.035)}
a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,20,18,.15)}
.brand{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font-family:'Clash Grotesk',sans-serif;
  font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--gold)}
@media(prefers-reduced-motion:no-preference){
  main{animation:up .7s cubic-bezier(.16,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="aurora a1"></div><div class="aurora a2"></div>
<div class="brand">Easy <em>Italia</em> Hub</div>
<main>
  <div class="code">4<em>0</em>4</div>
  <h1>Pagina non trovata</h1>
  <p>La pagina che cerchi non esiste o è stata spostata.<br/>
  <span class="si">Page not found · පිටුව හමු නොවීය · பக்கம் கிடைக்கவில்லை</span></p>
  <div class="actions">
    <a class="btn primary" href="/">← Torna alla home</a>
    <a class="btn ghost" href="/guide">Esplora le guide</a>
  </div>
</main>
</body>
</html>
