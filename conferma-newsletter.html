<!DOCTYPE html>

<script>/* La lingua della pagina si decide qui, prima di qualsiasi foglio di
   stile: uno script che sta dopo un <link rel=stylesheet> non gira finche' il
   CSS non e' arrivato, e quel ritardo si vedeva tutto sul cambio di lingua.

   La lingua predefinita del sito e' l'inglese. L'italiano e' una scelta come
   le altre: si applica solo se l'utente l'ha chiesto. "eih-lang-scelta"
   distingue una scelta vera dalla lingua che il sito applicava da se': prima
   ogni visita salvava "it" anche a chi non aveva mai toccato il selettore, e
   senza questa distinzione quei visitatori resterebbero in italiano per
   sempre. Chi non ha il segno di scelta riparte dall'inglese, una volta sola. */
try{if(!localStorage.getItem("eih-lang-scelta"))localStorage.removeItem("eih-lang");}catch(e){}
try{var _m=location.pathname.match(/^\/(en|si|ta)(\/|$)/),_l=_m?_m[1]:(localStorage.getItem("eih-lang")||"en");
if(!/^(it|en|si|ta)$/.test(_l))_l="en";
window.EIH_LANG=_l;
if(/^(en|si|ta)$/.test(_l)){var _p=location.pathname.replace(/^\/(en|si|ta)(?=\/|$)/,"").replace(/^\/+|\/+$/g,"").replace(/\.html$/,"")||"index";
window.__eihTrad={pagina:_p,lingua:_l,promessa:fetch("/assets/i18n/"+_p+"."+_l+".json",{priority:"high"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),promessaUi:fetch("/assets/i18n/_ui."+_l+".json",{priority:"high"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})};
var _s=document.createElement("script");_s.fetchPriority="high";_s.src="/assets/eih-i18n-page.js";_s.defer=true;document.head.appendChild(_s);
var _t=document.createElement("style");_t.textContent="html.eih-tr-attesa main{visibility:hidden}";document.head.appendChild(_t);
document.documentElement.classList.add("eih-tr-attesa");
setTimeout(function(){document.documentElement.classList.remove("eih-tr-attesa")},500);}}catch(e){}</script>

<script>
(function(){
  var p = new URLSearchParams(location.search);
  var ok = p.get('ok'), err = p.get('e'), already = p.get('already'), demo = p.get('demo');
  var el = document.getElementById('confirm-content');

  // Conferma avvenuta: la home smette di riproporre il modulo e scrive che
  // l'iscrizione c'è. Vale solo su questo browser, ed è quanto basta.
  if (ok) { try { localStorage.setItem('eih-nl-iscritto', '1'); } catch (e) {} }

  if (ok) {
    el.innerHTML = already
      ? '<div class="confirm-icon">✓</div><h1>Già iscritto</h1><p>Il tuo indirizzo email era già stato confermato in precedenza.</p><a href="/" class="confirm-btn">Torna alla home</a>'
      : demo
        ? '<div class="confirm-icon">✓</div><h1>Iscrizione ricevuta</h1><p>Modalità demo — il sistema di conferma è attivo con Supabase e Resend configurati.</p><a href="/" class="confirm-btn">Torna alla home</a>'
        : '<div class="confirm-icon">🎉</div><h1>Iscrizione confermata!</h1><p>Benvenuto nella newsletter di <strong>Easy Italia Hub</strong>. Riceverai aggiornamenti su novità burocratiche, opportunità selezionate e risorse per la vita in Italia.</p><a href="/" class="confirm-btn">Vai alla home</a>';
    return;
  }

  if (err === 'expired') {
    el.innerHTML = '<div class="confirm-icon">⏰</div><h1>Link scaduto</h1><p>Il link di conferma è valido solo per 24 ore. Iscriviti di nuovo per ricevere un nuovo link.</p><a href="/#newsletter" class="confirm-btn">Iscriviti di nuovo</a>';
    return;
  }

  if (err === 'invalid') {
    el.innerHTML = '<div class="confirm-icon">❌</div><h1>Link non valido</h1><p>Il link di conferma non è valido. Verifica di aver copiato l\'URL completo oppure iscriviti di nuovo.</p><a href="/#newsletter" class="confirm-btn">Iscriviti di nuovo</a>';
    return;
  }

  if (err === 'server') {
    el.innerHTML = '<div class="confirm-icon">⚠️</div><h1>Errore temporaneo</h1><p>Si è verificato un problema. Riprova tra qualche minuto o contattaci.</p><a href="/" class="confirm-btn">Torna alla home</a>';
    return;
  }

  // No params: user landed directly
  el.innerHTML = '<div class="confirm-icon">✉️</div><h1>Controlla la tua email</h1><p>Abbiamo inviato un link di conferma al tuo indirizzo. Clicca il link nell\'email per completare l\'iscrizione alla newsletter.</p><a href="/" class="confirm-btn">Torna alla home</a>';
})();
</script>
