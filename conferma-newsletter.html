         invalido:['සබැඳිය වලංගු නැත','මෙම තහවුරු කිරීමේ සබැඳිය වලංගු නොවේ. සම්පූර්ණ ලිපිනය පිටපත් කළාදැයි බලන්න, නැතහොත් නැවත දායක වන්න.'],
         errore:['තාවකාලික දෝෂයක්','යමක් වැරදී ඇත. මිනිත්තු කිහිපයකින් නැවත උත්සාහ කරන්න හෝ අපට ලියන්න.'],
         attesa:['ඔබේ ඊමේල් පරීක්ෂා කරන්න','ඔබේ ලිපිනයට තහවුරු කිරීමේ සබැඳියක් යවා ඇත. දායකත්වය සම්පූර්ණ කිරීමට ඊමේලයේ ඇති සබැඳිය ක්ලික් කරන්න.'],

         ok:['சந்தா உறுதிப்படுத்தப்பட்டது!','Easy Italia Hub செய்திமடலுக்கு வரவேற்கிறோம். ஆவண மாற்றங்கள், தேர்ந்தெடுத்த வாய்ப்புகள், இத்தாலி வாழ்க்கைக்கான தகவல்கள் உங்களுக்குக் கிடைக்கும்.'],
         scaduto:['இணைப்பு காலாவதியானது','உறுதிப்படுத்தல் இணைப்பு 24 மணி நேரம் மட்டுமே செல்லும். புதியது பெற மீண்டும் சந்தா செய்யுங்கள்.'],
         invalido:['செல்லாத இணைப்பு','இந்த உறுதிப்படுத்தல் இணைப்பு செல்லாது. முழு முகவரியையும் நகலெடுத்தீர்களா எனப் பாருங்கள், அல்லது மீண்டும் சந்தா செய்யுங்கள்.'],

         attesa:['உங்கள் மின்னஞ்சலைப் பாருங்கள்','உங்கள் முகவரிக்கு உறுதிப்படுத்தல் இணைப்பு அனுப்பியுள்ளோம். சந்தாவை முடிக்க மின்னஞ்சலில் உள்ள இணைப்பைச் சொடுக்குங்கள்.'],

  };
  function lingua(){
    var l = window.EIH_LANG;
    try { l = localStorage.getItem('eih-lang') || l; } catch (e) {}
    return T[l] ? l : 'en';
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var p = new URLSearchParams(location.search);
  var ok = p.get('ok'), err = p.get('e'), already = p.get('already'), demo = p.get('demo');
  var el = document.getElementById('confirm-content');

  // Conferma avvenuta: la home smette di riproporre il modulo e scrive che
  // l'iscrizione c'è. Vale solo su questo browser, ed è quanto basta.
  if (ok) { try { localStorage.setItem('eih-nl-iscritto', '1'); } catch (e) {} }

  var stato = ok ? (already ? 'gia' : demo ? 'demo' : 'ok')
    : err === 'expired' ? 'scaduto'
    : err === 'invalid' ? 'invalido'
    : err === 'server' ? 'errore'
    : 'attesa';
  var ICONA = { gia:'✓', demo:'✓', ok:'🎉', scaduto:'⏰', invalido:'❌', errore:'⚠️', attesa:'✉️' };

  function disegna() {
    var d = T[lingua()];
    var indietro = (stato === 'scaduto' || stato === 'invalido')
      ? ['/#newsletter', d.ancora]
      : ['/', stato === 'ok' ? d.vai : d.home];
    el.innerHTML = '<div class="confirm-icon">' + ICONA[stato] + '</div>'
      + '<h1>' + esc(d[stato][0]) + '</h1>'
      + '<p>' + esc(d[stato][1]) + '</p>'
      + '<a href="' + indietro[0] + '" class="btn-oro confirm-btn">' + esc(indietro[1]) + '</a>';
    el.setAttribute('data-no-tr', '');
  }
  disegna();
  // il messaggio si riscrive se l'utente cambia lingua stando qui
  window.addEventListener('eihLangChanged', disegna);
})();
