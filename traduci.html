<script>
(function(){
'use strict';
var textarea = document.getElementById('doc-text');
var resultArea = document.getElementById('result-area');
var buttons = document.querySelectorAll('.act-btn');

var prompts = {
  si: function(text){ return 'Traduci in sinhala questo testo italiano da una lettera ufficiale o documento burocratico. Usa un sinhala chiaro e comprensibile. Testo:\n\n' + text; },
  ta: function(text){ return 'Traduci in tamil questo testo italiano da una lettera ufficiale o documento burocratico. Usa un tamil chiaro e comprensibile. Testo:\n\n' + text; },
  en: function(text){ return 'Translate this Italian official letter or bureaucratic document into clear, simple English. Text:\n\n' + text; },
  simple: function(text){ return 'Spiega in italiano semplice (livello A2) cosa dice questo documento ufficiale italiano. Elenca i punti chiave e cosa deve fare il destinatario. Testo:\n\n' + text; }
};

var labels = {
  si: 'Traduzione in sinhala',
  ta: 'Traduzione in tamil',
  en: 'Traduzione in inglese',
  simple: 'Spiegazione in italiano semplice'
};

function setLoading(loading) {
  buttons.forEach(function(b){ b.disabled = loading; });
}

function showError(msg) {
  resultArea.style.display = 'block';
  resultArea.innerHTML = '<p class="err-msg">' + msg + '</p>';
}

function showSpinner(label) {
  resultArea.style.display = 'block';
  resultArea.innerHTML = '<div class="result-card"><span class="spinner"></span> Elaborazione in corso per <strong>' + escHtml(label) + '</strong>&#8230;</div>';
}

function showResult(lang, text) {
  resultArea.style.display = 'block';
  resultArea.innerHTML =
    '<div class="result-card">' +
      '<div class="result-header">' +
        '<span class="result-label">' + (labels[lang] || 'Risultato') + '</span>' +
        '<button class="copy-btn" id="copy-btn">&#128203; Copia</button>' +
      '</div>' +
      '<div class="result-text" id="result-text">' + escHtml(text) + '</div>' +
    '</div>';
  document.getElementById('copy-btn').addEventListener('click', function(){
    var el = document.getElementById('result-text');
    if (!el) return;
    navigator.clipboard.writeText(el.innerText).then(function(){
      document.getElementById('copy-btn').textContent = '✅ Copiato';
      setTimeout(function(){
        var btn = document.getElementById('copy-btn');
        if (btn) btn.textContent = '📋 Copia';
      }, 2000);
    }).catch(function(){});
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br/>');
}

buttons.forEach(function(btn) {
  btn.addEventListener('click', function(){
    var text = textarea.value.trim();
    if (!text) { showError('Incolla prima il testo del documento.'); return; }
    var lang = btn.getAttribute('data-lang');
    var label = btn.getAttribute('data-label');
    showSpinner(label);
    setLoading(true);
    var prompt = prompts[lang](text);
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      setLoading(false);
      if (data && data.reply) {
        showResult(lang, data.reply);
      } else {
        showError('Risposta non disponibile. Riprova tra qualche istante.');
      }
    })
    .catch(function(){
      setLoading(false);
      showError('Errore di connessione. Controlla la rete e riprova.');
    });
  });
});
})();
</script>
