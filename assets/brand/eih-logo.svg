<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Easy Italia Hub">

  <!-- ══════════════════════════════════════════
       ICON MARK — rounded badge + house/hub
       ══════════════════════════════════════════ -->

  <!-- Badge background -->
  <rect x="0" y="0" width="160" height="160" rx="32" fill="#7d7058"/>

  <!-- Roof / gable — white triangle -->
  <polygon points="80,24 130,72 30,72" fill="white"/>

  <!-- House body -->
  <rect x="36" y="72" width="88" height="64" rx="6" fill="white"/>

  <!-- Door — Italian green, centered -->
  <rect x="62" y="92" width="36" height="44" rx="5" fill="#009246"/>

  <!-- Accent dot — Sri Lanka lotus reference, at roof apex -->
  <circle cx="80" cy="22" r="6" fill="#009246"/>

  <!-- Path line inside door — subtle journey symbol -->
  <line x1="80" y1="100" x2="80" y2="128" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>


  <!-- ══════════════════════════════════════════
       WORDMARK
       ══════════════════════════════════════════ -->

  <!-- "easy" — light weight, taupe -->
  <text
    x="188" y="68"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="300"
    letter-spacing="6"
    fill="#7d7058"
    text-transform="uppercase">EASY</text>

  <!-- "ITALIA HUB" — bold, dark charcoal -->
  <text
    x="188" y="112"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="2"
    fill="#3d3528">ITALIA HUB</text>

  <!-- Accent rule under wordmark — green -->
  <rect x="188" y="124" width="264" height="3" rx="1.5" fill="#009246"/>

</svg>
