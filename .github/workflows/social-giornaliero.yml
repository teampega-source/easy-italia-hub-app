# Il giro quotidiano dell'agente social (spec §14).
#
# Alle 6:40 UTC — le 8:40 in Italia — l'agente prepara le bozze, i messaggi per
# i gruppi e, se glielo hai permesso, pubblica sulla Pagina e manda le risposte
# fisse ai commenti.
#
# Tre livelli di autonomia, e la differenza sta tutta nei segreti impostati:
#   nessun segreto        → bozze grezze in un artefatto. Non fa danni.
#   GEMINI_API_KEY        → testi veri in quattro lingue.
#   META_* + SOCIAL_AUTOPUBBLICA=1 → la Pagina lavora da sola.
#
# I gruppi restano manuali in ogni caso: Meta ha chiuso la Groups API.
name: Agente social

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      quante:
        description: 'Quanti temi preparare'
        default: '5'

permissions:
  contents: write   # serve a spingere la memoria: senza, ogni mattina si sveglia smemorato

concurrency:
  group: social-giornaliero
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le prove girano per prime: se il controllo di sicurezza è rotto, meglio
      # nessuna bozza che bozze non controllate — e soprattutto nessuna
      # pubblicazione automatica.
      - name: Prove
        run: node social/prove.mjs

      - name: Giro del giorno
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SOCIAL_AUTOPUBBLICA: ${{ secrets.SOCIAL_AUTOPUBBLICA }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOCIAL_REPORT_TO: ${{ secrets.SOCIAL_REPORT_TO }}
        run: |
          node social/cli.mjs \
            --quante "${{ github.event.inputs.quante || '5' }}" \
            ${{ secrets.META_PAGE_TOKEN != '' && '--commenti --pubblica' || '' }} \
            ${{ secrets.RESEND_API_KEY != '' && '--email' || '' }}

      # Due file tornano nel repository, e per due ragioni diverse.
      #
      # social/memoria.json — cosa è già uscito e in quali gruppi si è già
      # scritto. Ogni giro parte da una copia pulita: senza questo commit
      # l'agente si sveglierebbe smemorato e ripeterebbe se stesso.
      #
      # assets/dati/ai-social.json — il giro di oggi come lo legge /ai-social.
      # È il motivo per cui il lavoro dell'agente arriva a qualcuno: chi
      # gestisce la Pagina apre quell'indirizzo, non GitHub.
      - name: Ricorda e pubblica il cruscotto
        run: |
          if git diff --quiet -- social/memoria.json assets/dati/ai-social.json; then
            echo "niente di nuovo"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/memoria.json assets/dati/ai-social.json
          git commit -m "Agente social: giro del giorno" \
                     -m "Memoria aggiornata e cruscotto di /ai-social riscritto."
          git push

      - name: Conserva la coda
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ github.run_number }}
          path: social/coda/
          retention-days: 14
