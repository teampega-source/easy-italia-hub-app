# Dice a IndexNow (Bing, Yandex, Naver, Seznam) quali pagine sono cambiate.
#
# Parte a ogni push su main e una volta al giorno, così anche un cambio fatto
# a mano sulla sitemap viene segnalato. Gratuito, senza account: la chiave è
# il file <chiave>.txt nella radice del sito.
name: IndexNow

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * *'   # ogni giorno alle 06:43 UTC
  workflow_dispatch:
    inputs:
      tutte:
        description: 'Segnala tutte le pagine della sitemap'
        type: boolean
        required: false
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  segnala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Segnala le pagine cambiate
        env:
          GIORNI: '3'
        run: |
          if [ "${{ github.event.inputs.tutte }}" = "true" ]; then
            node scripts/indexnow.mjs --tutte
          else
            node scripts/indexnow.mjs
          fi
