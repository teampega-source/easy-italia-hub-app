# Dice a IndexNow (Bing, Yandex, Naver, Seznam) quali pagine sono cambiate.
#
# A ogni push guarda i file HTML toccati e segnala le loro URL in tutte e
# quattro le lingue. Il lastmod della sitemap non basta: resta vecchio anche
# quando una pagina cambia, e IndexNow non riceverebbe niente.
#
# Una volta al giorno, senza push, ripiega sulle pagine con lastmod recente.
# Gratuito e senza account: la chiave è il file <chiave>.txt nella radice.
name: IndexNow

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * *'   # ogni giorno alle 06:43 UTC
  workflow_dispatch:
    inputs:
      tutte:
        description: 'Segnala tutte le pagine della sitemap'
        type: boolean
        required: false
        default: false
      file:
        description: 'Prova: file HTML da segnalare (es. srilankadirectory.html)'
        type: string
        required: false

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  segnala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Quali file HTML sono cambiati
        id: cambiati
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE=$(git diff --name-only "$BASE" "${{ github.sha }}" | grep -E '\.html$' || true)
          {
            echo "file<<FINE_FILE"
            echo "$FILE"
            echo "FINE_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Segnala le pagine cambiate
        env:
          GIORNI: '3'
          FILE_CAMBIATI: ${{ github.event.inputs.file || steps.cambiati.outputs.file }}
        run: |
          if [ "${{ github.event.inputs.tutte }}" = "true" ]; then
            node scripts/indexnow.mjs --tutte
          else
            node scripts/indexnow.mjs
          fi
